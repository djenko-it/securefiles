<!DOCTYPE html>
<html lang="{{ current_lang }}" data-bs-theme="{{ user_theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link href="/static/css/custom.css" rel="stylesheet">
  <link href="/branding.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script nonce="{{ csp_nonce }}" src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
