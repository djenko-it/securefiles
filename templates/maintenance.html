<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ settings.app_name }} — Maintenance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center px-4" style="max-width:480px;">
    <i class="fas fa-wrench fa-3x mb-4" style="color:var(--accent, #4361ee);"></i>
    <h1 class="h3 fw-semibold mb-3">{{ settings.app_name }} est en maintenance</h1>
    <p class="text-muted">{{ message or 'Le site est temporairement en maintenance. Merci de revenir plus tard.' }}</p>
  </div>
</body>
</html>
