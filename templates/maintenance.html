<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ settings.app_name }} — {{ _('Maintenance') }}</title>
  <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center px-4" style="max-width:480px;">
    <i class="fas fa-wrench fa-3x mb-4" style="color:var(--accent, #f97316);"></i>
    <h1 class="h3 fw-semibold mb-3">{{ _('%(app_name)s is under maintenance', app_name=settings.app_name) }}</h1>
    <p class="text-muted">{{ message or _('The site is temporarily under maintenance. Please come back later.') }}</p>
  </div>
</body>
</html>
