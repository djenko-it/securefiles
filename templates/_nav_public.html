<div class="d-flex align-items-center gap-2">
  {%- if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-light">
      <i class="fas fa-table-list me-1"></i>{{ _('My shares') }}
    </a>
    <a href="{{ url_for('logout') }}" class="text-secondary small ms-1">{{ _('Disconnect') }}</a>
  {%- else %}
    {% if settings.sso_force == '1' %}
      <a href="{{ url_for('sso_login') }}" class="btn btn-sm btn-outline-light">
        <i class="fas fa-key me-1"></i>{{ settings.sso_provider_name }}
      </a>
    {% else %}
      <a href="{{ url_for('login') }}" class="btn btn-sm btn-outline-light">{{ _('Login') }}</a>
      <a href="{{ url_for('register') }}" class="btn btn-sm btn-primary">{{ _('Sign up') }}</a>
    {% endif %}
  {%- endif %}
</div>
