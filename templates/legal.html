<!DOCTYPE html>
<html lang="fr" data-bs-theme="{{ user_theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ settings.app_name }} — {{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-shield-halved me-2"></i>{{ settings.app_name }}</a>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 860px;">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="legal-content">
          {{ content | safe }}
        </div>
        <hr class="mt-4">
        <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">
          <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
      </div>
    </div>
  </main>

  <footer>
    {{ settings.app_name }} &mdash;
    <a href="mailto:{{ settings.contact_email }}">{{ settings.contact_email }}</a>
    &nbsp;·&nbsp;
    <a href="{{ url_for('mentions_legales') }}">Mentions légales</a>
    &nbsp;·&nbsp;
    <a href="{{ url_for('cgu') }}">CGU</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
